name: Linux smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    env:
      DUST_AND_DEBT_SILENT: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Verify game data
        run: python3 game.py --self-test
      - name: Audio process cleanup and silent test regression
        run: xvfb-run -a python3 tests/audio_cleanup_test.py
      - name: Smoke test v1.3 foundation
        run: xvfb-run -a python3 tests/smoke_test.py
      - name: Dialogue regression tests
        run: xvfb-run -a python3 tests/dialogue_test.py
      - name: Great Frontier regression tests
        run: xvfb-run -a python3 tests/frontier_hotfix_test.py
      - name: Living Towns regression tests
        run: xvfb-run -a python3 tests/living_towns_test.py
      - name: Gunfight regression tests
        run: xvfb-run -a python3 tests/combat_test.py
      - name: Tile and terrain regression tests
        run: xvfb-run -a python3 tests/terrain_test.py
      - name: Emergent Frontier regression tests
        run: xvfb-run -a python3 tests/emergent_test.py
      - name: World Polish regression tests
        run: xvfb-run -a python3 tests/world_polish_test.py
      - name: Complete Frontier release regression
        run: xvfb-run -a python3 tests/release_test.py
      - name: Frontier Reborn content regression
        run: xvfb-run -a python3 tests/frontier_reborn_test.py
      - name: "Input regression - sheriff, door, horse and overlays"
        run: xvfb-run -a python3 tests/input_fix_test.py
      - name: Mission spawn and stuck-rider regression
        run: xvfb-run -a python3 tests/mission_spawn_test.py
      - name: Dead or alive bounty capture regression
        run: xvfb-run -a python3 tests/bounty_capture_test.py
      - name: Frontier Justice field arrests
        run: xvfb-run -a python3 tests/field_arrest_test.py
      - name: Living Law surrender patrol and jail regression
        run: xvfb-run -a python3 tests/living_law_test.py
      - name: Working Frontier economy and future audio regression
        run: xvfb-run -a python3 tests/working_frontier_test.py
      - name: Great Territory 10x map and long-distance regression
        run: xvfb-run -a python3 tests/great_territory_test.py
      - name: Roads and Consequences regional encounters and real audio regression
        run: xvfb-run -a python3 tests/roads_audio_test.py
      - name: Illustrated New Austellia atlas and geographical collision regression
        run: xvfb-run -a python3 tests/new_austellia_test.py
      - name: Handcrafted Frontier horse gallop and regional quests
        run: xvfb-run -a python3 tests/handcrafted_frontier_test.py

      - name: Combat progression v2.8 regression
        run: xvfb-run -a python3 tests/combat_progression_test.py

      - name: Rivers Ridges and Stone natural terrain
        run: xvfb-run -a python3 tests/natural_terrain_test.py

      - name: Enemy tactics and morale regression v2.8
        run: xvfb-run -a python3 tests/enemy_tactics_test.py

      - name: v2.9 presentation save integrity and settings regression
        run: xvfb-run -a python3 tests/presentation_reliability_test.py

      - name: Original Western score and audio player integration
        run: xvfb-run -a python3 tests/music_integration_test.py

      - name: v2.9-map phase 0-1 atlas route graph baseline
        run: python3 tests/route_geometry_test.py

      - name: Starter world/minimap/vector/illustrated map consistency
        run: xvfb-run -a python3 tests/starter_route_test.py

      - name: Persistent text fonts and HUD heading bounds
        run: xvfb-run -a python3 tests/text_rendering_test.py

      - name: GFX-02 Cinder Creek art and geometry regression
        run: xvfb-run -a python3 tests/cinder_creek_gfx_test.py

      - name: GFX-01 retained Canvas regression
        run: xvfb-run -a python3 tests/render_cache_test.py

      - name: Authored route masks and retired terrain grid
        run: python3 tests/route_mask_test.py

      - name: Route-aware bridge approaches and failure detection
        run: python3 tests/bridge_approach_test.py

      - name: Shared bridge geometry, art and water safety
        run: python3 tests/bridge_deck_test.py

      - name: Fine route clearance sampler and bridge junction regression
        run: python3 tests/route_clearance_test.py

      - name: Fishing, camp and road route integration
        run: python3 tests/route_destinations_test.py

      - name: Camera-local route and destination art smoke test
        run: xvfb-run -a python3 tests/route_render_test.py

      - name: Require physical road, trail and rail clearance
        run: python3 tools/audit_routes.py --physical --include-rail --check --json /tmp/dust_debt_road_audit.json

      - name: Preserve detailed route audit for development
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-austellia-road-audit
          path: /tmp/dust_debt_road_audit.json
